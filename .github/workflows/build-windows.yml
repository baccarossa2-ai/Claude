name: Crea EXE Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Pubblica una release con gli EXE (tag v + versione di package.json)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Test
        run: npm test

      - name: Crea installer e versione portatile
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Carica gli EXE
        uses: actions/upload-artifact@v4
        with:
          name: Athlos-Suite-Windows
          path: dist/*.exe
          retention-days: 30

      - name: Versione
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Pubblica la release (tag v* oppure avvio manuale con "release")
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          name: Athlos ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
